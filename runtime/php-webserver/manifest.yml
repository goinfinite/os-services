manifestVersion: v1
name: php-webserver
slugs:
  - php-webserver
  - php-ws
  - php
nature: solo
type: runtime
description: PHP is a general-purpose scripting language geared towards web development. OpenLiteSpeed (PHP WebServer) is a high-performance, lightweight, open source HTTP (and PHP) server developed and copyrighted by LiteSpeed Technologies.
versions:
  - latest
  - legacy
portBindings:
  - 8080/http
  - 8443/https
startCmd: /usr/local/lsws/bin/litespeed -d
installTimeoutSecs: 1200
installCmdSteps:
  - bash %installableServiceAssetsDirPath%/install.sh "%version%" "%primaryHostname%" "%installableServiceAssetsDirPath%"
  - chown -R lsadm:nogroup /app/conf/php-webserver/
  - chown -R nobody:nogroup /app/logs/php-webserver
  - /infinite/os cron create -s "*/2 * * * *" -d "AutoReloadPhpWebServerAfterHtaccessChange" -c "if ! find /app/html -maxdepth 7 -type f -name '.htaccess' -newer /usr/local/lsws/cgid -exec false {} +; then /infinite/os services update -n php-webserver -s restart; fi"
  - /infinite/os cron create -s "0 0 * * *" -d "DailyLswsSwapCleanup" -c "find /tmp/lshttpd/swap/ -type f -mmin +1440 -delete"
uninstallCmdSteps:
  - /infinite/os cron delete -d "DailyLswsSwapCleanup"
  - /infinite/os cron delete -d "AutoReloadPhpWebServerAfterHtaccessChange"
  - if [[ -L "/usr/bin/php" ]]; then phpTarget="$(readlink -f "/usr/bin/php" || true)"; case "$phpTarget" in /usr/local/lsws/lsphp74/*|/usr/local/lsws/lsphp82/*) unlink "/usr/bin/php" ;; esac; fi
  - packageList="$(dpkg-query -W -f='${binary:Package}\n' openlitespeed 'lsphp*' 2>/dev/null || true)"; if [[ -n "$packageList" ]]; then mapfile -t packageNames <<< "$packageList"; apt-get purge -y "${packageNames[@]}"; fi
uninstallFilePaths:
  - /etc/apt/sources.list.d/infinite-apt.list
  - /usr/share/keyrings/infinite-apt.gpg
  - /app/conf/php-webserver/
stopCmdSteps:
  - sleep 1; if pgrep litespeed >/dev/null; then /usr/local/lsws/bin/lswsctrl stop; fi
  - if pgrep lsphp >/dev/null; then pkill lsphp; fi
estimatedSizeBytes: 1073741824
avatarUrl: https://goinfinite.github.io/os-services/runtime/php-webserver/assets/avatar.jpg
