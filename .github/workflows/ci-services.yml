name: "Services CI"
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      MATRIX: ${{ steps.discover.outputs.MATRIX }}
      ALL_ITEMS: ${{ steps.discover.outputs.ALL_ITEMS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Discover and classify services
        id: discover
        run: |
          set -euo pipefail
          pip install pyyaml -q
          python3 << 'PYEOF'
          import json, os, re, yaml

          catalogDirs = ["database", "runtime", "webserver", "other"]
          namePattern = r"^[a-zA-Z0-9_-]{1,64}$"
          versionPattern = r"^[a-zA-Z0-9._-]{1,64}$"
          manifestFileNames = ("manifest.json", "manifest.yml", "manifest.yaml")

          def findManifest(serviceDir):
              for manifestFileName in manifestFileNames:
                  manifestPath = os.path.join(serviceDir, manifestFileName)
                  if os.path.isfile(manifestPath):
                      return manifestPath
              return None

          def parseManifest(manifestPath):
              with open(manifestPath, encoding="utf-8") as manifestHandle:
                  if manifestPath.endswith(".json"):
                      return json.load(manifestHandle)
                  return yaml.safe_load(manifestHandle)

          def recordSkippedItem(allItems, itemName, itemType, itemNature, skipReason):
              allItems.append({
                  "name": itemName,
                  "type": itemType,
                  "nature": itemNature,
                  "version": "",
                  "portProtocol": "",
                  "status": "skip",
                  "error": skipReason,
              })

          repoRoot = os.environ.get("GITHUB_WORKSPACE", ".")
          allItems = []
          testItems = []
          seenNames = set()

          for catalogDir in catalogDirs:
              catalogPath = os.path.join(repoRoot, catalogDir)
              if not os.path.isdir(catalogPath):
                  continue
              for entryName in sorted(os.listdir(catalogPath)):
                  entryPath = os.path.join(catalogPath, entryName)
                  if not os.path.isdir(entryPath):
                      continue

                  manifestPath = findManifest(entryPath)
                  if manifestPath is None:
                      recordSkippedItem(
                          allItems, entryName, catalogDir, "", "NoManifestFound",
                      )
                      continue

                  try:
                      manifest = parseManifest(manifestPath)
                  except Exception as parseError:
                      recordSkippedItem(
                          allItems, entryName, catalogDir, "",
                          f"ManifestParseError: {parseError}",
                      )
                      continue

                  name = manifest.get("name", "")
                  if not isinstance(name, str):
                      name = entryName
                  if not re.match(namePattern, name):
                      recordSkippedItem(
                          allItems, name, catalogDir, "", "InvalidName",
                      )
                      continue

                  versions = manifest.get("versions", [])
                  if not versions:
                      recordSkippedItem(
                          allItems, name, catalogDir, "", "NoVersions",
                      )
                      continue

                  portBindings = manifest.get("portBindings", [])
                  if not portBindings:
                      recordSkippedItem(
                          allItems, name, catalogDir, "", "NoPortBindings",
                      )
                      continue

                  itemNature = manifest.get("nature", "")
                  itemType = manifest.get("type", catalogDir)
                  portProtocol = str(portBindings[0])

                  installSteps = manifest.get("installCmdSteps", "")
                  hasInstallSteps = bool(installSteps)
                  if isinstance(installSteps, list):
                      hasInstallSteps = any(
                          isinstance(installStep, str)
                          and installStep.strip() != ""
                          for installStep in installSteps
                      )

                  if not hasInstallSteps:
                      recordSkippedItem(
                          allItems, name, itemType, itemNature, "NoInstallCmdSteps",
                      )
                      continue

                  if name in seenNames:
                      recordSkippedItem(
                          allItems, name, itemType, itemNature, "DuplicateName",
                      )
                      continue

                  seenNames.add(name)

                  for versionValue in versions:
                      version = str(versionValue)
                      if not re.match(versionPattern, version):
                          recordSkippedItem(
                              allItems, name, itemType, itemNature,
                              f"InvalidVersion: {version}",
                          )
                          continue
                      testItems.append({
                          "name": name,
                          "version": version,
                          "portProtocol": portProtocol,
                          "nature": itemNature,
                          "type": itemType,
                      })
                      allItems.append({
                          "name": name,
                          "type": itemType,
                          "nature": itemNature,
                          "version": version,
                          "portProtocol": portProtocol,
                          "status": "test",
                          "error": None,
                      })

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as outputHandle:
              outputHandle.write("MATRIX=" + json.dumps(testItems) + "\n")
              outputHandle.write("ALL_ITEMS=" + json.dumps(allItems) + "\n")

          summaryLines = [
              f"Discovered {len(allItems)} services, {len(testItems)} testable"
          ]
          for catalogItem in allItems:
              if catalogItem["status"] == "skip":
                  summaryLines.append(
                      f"  SKIP {catalogItem['name']}: {catalogItem.get('error', '')}"
                  )
          for testItem in testItems:
              summaryLines.append(
                  f"  TEST {testItem['name']} v{testItem['version']}"
                  f" ({testItem['type']})"
              )
          print("\n".join(summaryLines))
          PYEOF

  test:
    needs: [discover]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OS_IMAGE_REPOSITORY: "goinfinite/os"
    strategy:
      matrix:
        item: ${{ fromJson(needs.discover.outputs.MATRIX) }}
      fail-fast: false
      max-parallel: 4
    steps:
      - name: Get latest OS tag
        id: os-version
        run: |
          set -euo pipefail
          registryBaseUrl="https://registry.hub.docker.com/v2/repositories"
          tagListUrl="${registryBaseUrl}/${OS_IMAGE_REPOSITORY}/tags?page_size=5"
          jqTagProgram='.results
            | map(select((.name | contains("latest")) | not))
            | sort_by(.last_updated)
            | reverse
            | .[0].name
            // empty'
          latestTag=$(curl -s "${tagListUrl}" | jq -r "${jqTagProgram}")
          if [ -z "${latestTag}" ]; then
            echo "::error::NoUsableOsImageTagFound"
            exit 1
          fi
          echo "OsImageTag: ${latestTag}"
          echo "OS_TAG=${latestTag}" >> "${GITHUB_OUTPUT}"
      - name: Pull OS image
        env:
          OS_TAG: ${{ steps.os-version.outputs.OS_TAG }}
        run: |
          set -euo pipefail
          docker pull "docker.io/${OS_IMAGE_REPOSITORY}:${OS_TAG}"
      - name: Start container
        id: start
        env:
          ITEM_NAME: ${{ matrix.item.name }}
          OS_TAG: ${{ steps.os-version.outputs.OS_TAG }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          containerName="${ITEM_NAME}-ci-${RUN_ID}"
          echo "CONTAINER_NAME=${containerName}" >> "${GITHUB_OUTPUT}"
          docker run -d --rm \
            --name "${containerName}" \
            --cpus=2 \
            --memory=4G \
            --env "PRIMARY_VHOST=goinfinite.local" \
            --env "LOG_LEVEL=debug" \
            "docker.io/${OS_IMAGE_REPOSITORY}:${OS_TAG}"
      - name: Wait for container readiness
        env:
          CONTAINER_NAME: ${{ steps.start.outputs.CONTAINER_NAME }}
        run: |
          set -euo pipefail
          echo "WaitingForContainer: ${CONTAINER_NAME}"
          for readinessAttempt in {1..12}; do
            if docker exec "${CONTAINER_NAME}" os version >/dev/null 2>&1; then
              echo "ContainerReady: attempt ${readinessAttempt}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::ContainerNotReadyWithin60s"
          exit 1
      - name: Install service
        id: install
        env:
          CONTAINER_NAME: ${{ steps.start.outputs.CONTAINER_NAME }}
          ITEM_NAME: ${{ matrix.item.name }}
          ITEM_VERSION: ${{ matrix.item.version }}
          ITEM_PORT_PROTOCOL: ${{ matrix.item.portProtocol }}
        run: |
          set -euo pipefail
          resultFilePath="result-${ITEM_NAME}-${ITEM_VERSION}.json"
          installOutputPath=$(mktemp)
          containerLogPath=$(mktemp)
          containerLogTailBytes=1048576
          installTimeoutSecs=1500
          set +e
          # Outer guard. The OS enforces the manifest installTimeoutSecs first.
          timeout "${installTimeoutSecs}s" docker exec "${CONTAINER_NAME}" \
            os services create-installable \
            -n "${ITEM_NAME}" \
            -v "${ITEM_VERSION}" \
            -p "${ITEM_PORT_PROTOCOL}" \
            > "${installOutputPath}" 2>&1
          installExitCode=$?
          set -e
          docker logs --timestamps "${CONTAINER_NAME}" \
            > "${containerLogPath}" 2>&1 || true
          tail -c "${containerLogTailBytes}" "${containerLogPath}" \
            > "${containerLogPath}.tail"
          export CI_NAME="${ITEM_NAME}"
          export CI_VERSION="${ITEM_VERSION}"
          export CI_PORT="${ITEM_PORT_PROTOCOL}"
          export CI_EXIT="${installExitCode}"
          export CI_OUT="${installOutputPath}"
          export CI_LOGS="${containerLogPath}.tail"
          export CI_RESULT="${resultFilePath}"
          python3 << 'PYEOF'
          import json, os

          with open(os.environ["CI_OUT"], encoding="utf-8") as outputHandle:
              installOutput = outputHandle.read()
          with open(os.environ["CI_LOGS"], encoding="utf-8") as logHandle:
              containerLogs = logHandle.read()
          resultPayload = {
              "name": os.environ["CI_NAME"],
              "version": os.environ["CI_VERSION"],
              "portProtocol": os.environ["CI_PORT"],
              "exitCode": int(os.environ["CI_EXIT"]),
              "output": installOutput,
              "containerLogs": containerLogs,
          }
          with open(os.environ["CI_RESULT"], "w", encoding="utf-8") as resultHandle:
              json.dump(resultPayload, resultHandle)
          PYEOF
          rm -f "${installOutputPath}" "${containerLogPath}" \
            "${containerLogPath}.tail"
          echo "EXIT_CODE=${installExitCode}" >> "${GITHUB_OUTPUT}"
          echo "InstallExitCode: ${installExitCode}"
      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.item.name }}-${{ matrix.item.version }}
          path: result-${{ matrix.item.name }}-${{ matrix.item.version }}.json
      - name: Cleanup container
        if: always()
        env:
          CONTAINER_NAME: ${{ steps.start.outputs.CONTAINER_NAME }}
        run: |
          set -euo pipefail
          docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true

  report:
    needs: [discover, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download result artifacts
        if: always()
        uses: actions/download-artifact@v4
        with:
          path: results/
          merge-multiple: true
      - name: Generate job summary
        if: always()
        env:
          ALL_ITEMS: ${{ needs.discover.outputs.ALL_ITEMS }}
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
          import json, os, glob

          allItemsRaw = os.environ.get("ALL_ITEMS", "[]")
          allItems = json.loads(allItemsRaw)

          testResults = {}
          for resultPath in glob.glob("results/result-*.json"):
              with open(resultPath, encoding="utf-8") as resultHandle:
                  resultData = json.load(resultHandle)
              testResults[
                  (resultData["name"], resultData["version"])
              ] = resultData

          summaryLines = []
          summaryLines.append("# Services CI Results")
          summaryLines.append("")
          summaryLines.append(
              "| Service | Type | Nature | Version | Port | Status | Details |"
          )
          summaryLines.append("|---|---|---|---|---|---|---|")

          def buildFailDetail(resultData, exitCode):
              installOutput = resultData.get("output", "")
              containerLogs = resultData.get("containerLogs", "")
              daemonErrorLines = [
                  line.strip()
                  for line in containerLogs.splitlines()
                  if '"level":"error"' in line
              ]
              daemonError = (
                  daemonErrorLines[-1] if daemonErrorLines else ""
              )
              cliLastLine = (
                  installOutput.strip().split("\n")[-1]
                  if installOutput.strip()
                  else ""
              )
              return (
                  daemonError or cliLastLine or f"exit code {exitCode}"
              )[:120]

          def classifyTestResult(itemStatus, resultKey, catalogItem, testResults):
              resultData = testResults.get(resultKey)
              if itemStatus != "test":
                  return "SKIP", catalogItem.get("error", ""), resultData
              if resultData is None:
                  return "FAIL", "ResultArtifactNotFound", resultData
              exitCode = resultData.get("exitCode", -1)
              if exitCode == 0:
                  return "PASS", "", resultData
              return "FAIL", buildFailDetail(resultData, exitCode), resultData

          failedCount = 0
          for catalogItem in allItems:
              name = catalogItem["name"]
              itemType = catalogItem.get("type", "")
              itemNature = catalogItem.get("nature", "")
              itemStatus = catalogItem["status"]
              version = catalogItem.get("version", "")
              portProtocol = catalogItem.get("portProtocol", "")

              testStatus, statusDetail, resultData = classifyTestResult(
                  itemStatus, (name, version), catalogItem, testResults,
              )
              if resultData is not None:
                  version = resultData.get("version", version)
                  portProtocol = resultData.get("portProtocol", portProtocol)
              if testStatus == "FAIL":
                  failedCount += 1

              summaryLines.append(
                  f"| {name} | {itemType} | {itemNature} | {version}"
                  f" | {portProtocol} | {testStatus} | {statusDetail} |"
              )

          if not allItems:
              summaryLines.append(
                  "| _NoServicesDiscovered_ | - | - | - | - | - | - |"
              )

          summaryText = "\n".join(summaryLines)

          stepSummaryPath = os.environ.get("GITHUB_STEP_SUMMARY")
          if stepSummaryPath:
              with open(stepSummaryPath, "a", encoding="utf-8") as summaryHandle:
                  summaryHandle.write(summaryText + "\n")

          print(summaryText)
          print()

          passedCount = 0
          skippedCount = 0
          for catalogItem in allItems:
              if catalogItem["status"] == "skip":
                  skippedCount += 1
                  continue
              if catalogItem["status"] != "test":
                  continue
              resultData = testResults.get(
                  (catalogItem["name"], catalogItem.get("version", "")), {}
              )
              if resultData.get("exitCode") == 0:
                  passedCount += 1

          print(
              f"Summary: {passedCount} passed, {failedCount} failed,"
              f" {skippedCount} skipped"
          )

          if failedCount > 0:
              print(f"::error::ServicesCiFailed: {failedCount}")
              exit(1)

          if not allItems:
              print("NoServicesDiscovered")
          PYEOF
